# ═══════════════════════════════════════════════════════════════════════════
#  supervisord.conf — إدارة 4 عمليات متوازية داخل الحاوية
#  ─────────────────────────────────────────────────────────────────────────
#  1. wireproxy    — نفق Cloudflare WARP (SOCKS5 proxy على 127.0.0.1:1080)
#  2. bgutil       — خادم PO Token (127.0.0.1:4416) لتوليد PO Tokens لـ yt-dlp
#  3. yt_cookies   — نظام الكوكيز الذكي (يجدّد كل 6 ساعات)
#  4. bot           — MUS Bot v26.1 نفسه
# ═══════════════════════════════════════════════════════════════════════════

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ── 1) wireproxy: نفق Cloudflare WARP ──────────────────────────────────────
# ملاحظة: autostart=false افتراضياً — entrypoint.sh يفعّله ديناميكياً فقط عند الحاجة
# (عندما لا يكون IPv6 متاحاً). على Railway مع Outbound IPv6، لا حاجة لـ WARP.
# محاولة تشغيل wireproxy على Railway (الذي يحظر UDP outbound) تؤدي لـ FATAL state.
[program:wireproxy]
command=/opt/warp/bin/wireproxy -c /opt/warp/wireproxy.conf
priority=10
autostart=false
autorestart=true
startsecs=3
startretries=2
stopwaitsecs=5
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── 2) bgutil: خادم PO Token على المنفذ 4416 ──────────────────────────────
[program:bgutil]
command=/usr/local/bin/node /opt/bgutil/server/build/main.js
directory=/opt/bgutil/server
priority=20
autostart=true
autorestart=true
startsecs=3
startretries=10
stopwaitsecs=5
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── 3) yt_cookies.py: نظام الكوكيز الذكي (يجدّد كل 6 ساعات) ──────────────
[program:yt_cookies]
command=/usr/bin/python3 /opt/scripts/yt_cookies.py
directory=/app
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=10
killasgroup=true
stopasgroup=true
environment=YT_AUTO_COOKIES_FILE="/app/cookies/cookies.txt",YT_COOKIES_INTERVAL_SEC="%(ENV_YT_COOKIES_INTERVAL_SEC)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── 4) MUS Bot v26.1: الـ bot نفسه (أعلى أولوية — يبدأ بعد الخدمات) ────
[program:bot]
command=/usr/local/bin/node index.js
directory=/app
priority=100
autostart=true
autorestart=true
startsecs=10
startretries=5
stopwaitsecs=15
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PATH="/usr/local/bin:/usr/bin:/bin:/root/.deno/bin"
